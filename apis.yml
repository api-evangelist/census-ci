aid: census-ci
url: https://raw.githubusercontent.com/api-evangelist/census-ci/refs/heads/main/apis.yml
name: Census
kind: company
description: Census is a reverse ETL and data activation platform that syncs modeled
  data out of the cloud data warehouse into 200+ business tools (CRM, ads, marketing,
  support, and analytics), plus an Audience Hub for building and activating segments.
  The Census Management API (base https://app.getcensus.com/api/v1, Bearer workspace
  token) lets teams manage sources, destinations, syncs, sync runs, datasets/models,
  connections, and segments/audiences programmatically.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Reverse ETL
- Data Activation
- Data Warehouse
- Syncs
- Audience Hub
- Data Marketing
created: '2026-07-01'
modified: '2026-07-01'
specificationVersion: '0.19'
