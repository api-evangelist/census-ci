aid: census-ci
name: Census
review:
  question: Does Census expose a documented public WebSocket API?
  answer: false
  date: '2026-07-01'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was created. The Census Management API is a
    synchronous REST/HTTPS API with no documented streaming, SSE, or
    WebSocket surface. Near-real-time behavior is delivered by the sync
    engine on a schedule and by the POST /syncs/{id}/trigger endpoint plus
    polling of sync runs, not by a persistent event stream.
findings:
  summary: |
    Census does not publish a documented public WebSocket API. The Census
    Management API (base https://app.getcensus.com/api/v1) is a REST/HTTPS
    API authenticated with a workspace API access token as a Bearer token.
    Data activation is batch/scheduled reverse ETL; consumers trigger syncs
    via POST /syncs/{id}/trigger and observe results by polling sync runs
    (GET /sync_runs, GET /sync_runs/{id}). No ws:// or wss:// endpoint is
    documented. Census does support outbound event delivery for sync
    completion via webhooks/notifications, but that is HTTP callback, not a
    WebSocket surface.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://app.getcensus.com/api/v1
      documented: true
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented for the Census Management API.
  endpointsConfirmedRest:
    - GET    https://app.getcensus.com/api/v1/sources
    - POST   https://app.getcensus.com/api/v1/sources
    - GET    https://app.getcensus.com/api/v1/sources/{source_id}
    - GET    https://app.getcensus.com/api/v1/sources/{source_id}/objects
    - GET    https://app.getcensus.com/api/v1/destinations
    - POST   https://app.getcensus.com/api/v1/destinations
    - GET    https://app.getcensus.com/api/v1/destinations/{destination_id}
    - GET    https://app.getcensus.com/api/v1/destinations/{destination_id}/objects
    - GET    https://app.getcensus.com/api/v1/connectors
    - GET    https://app.getcensus.com/api/v1/connectors/{service_name}/object_types
    - GET    https://app.getcensus.com/api/v1/syncs
    - POST   https://app.getcensus.com/api/v1/syncs
    - GET    https://app.getcensus.com/api/v1/syncs/{sync_id}
    - PATCH  https://app.getcensus.com/api/v1/syncs/{sync_id}
    - DELETE https://app.getcensus.com/api/v1/syncs/{sync_id}
