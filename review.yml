    - POST   https://app.getcensus.com/api/v1/models
    - GET    https://app.getcensus.com/api/v1/models/{model_id}
    - PATCH  https://app.getcensus.com/api/v1/models/{model_id}
    - GET    https://app.getcensus.com/api/v1/datasets
    - POST   https://app.getcensus.com/api/v1/datasets
    - GET    https://app.getcensus.com/api/v1/segments
    - POST   https://app.getcensus.com/api/v1/segments
    - GET    https://app.getcensus.com/api/v1/segments/{segment_id}
sources:
  - url: https://developers.getcensus.com/api-reference/introduction/overview
    type: Documentation
    note: Management API overview; REST base https://app.getcensus.com/api/v1, Bearer workspace token. No WebSocket mentioned.
  - url: https://developers.getcensus.com/api-reference/syncs/list-syncs
    type: APIReference
    note: Syncs and sync-run endpoints; all HTTPS REST.
  - url: https://www.getcensus.com/blog/trigger-sync-api-announcement
    type: Documentation
    note: Sync trigger API powers Airflow/Dagster/Prefect/dbt Cloud via REST + polling, not streaming.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists and no SSE stream is documented, so
    no AsyncAPI artifact was authored. The catalog entry models the Census
    Management API as REST with an OpenAPI specification only. Census was
    acquired by Fivetran; developers.getcensus.com / docs.getcensus.com now
    301-redirect to fivetran.com/docs/activations, but the Census Management
    API and app.getcensus.com base URL remain the operative surface.
